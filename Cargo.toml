[package]
name = "xelgui"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = { version = "0.30.13", features = ["wayland"] }
wgpu = "28.0"
anyhow = "1.0"
env_logger = "0.10"
pollster = "0.4"
glam = { version = "0.28", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
strip = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "28.0", features = ["webgl"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
]}
